name: Build KeepAwake

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Build KeepAwake.exe
        run: python build_keep_awake.py --build-only
        env:
          # runner 上 Python 默认 cp1252,中文 print 会 UnicodeEncodeError 崩构建
          PYTHONUTF8: "1"

      - name: Generate sha256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 'build/KeepAwake.exe').Hash.ToLower()
          "$hash  KeepAwake.exe" | Out-File -Encoding ascii 'build/KeepAwake.exe.sha256'
          Get-Content 'build/KeepAwake.exe.sha256'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-exe
          path: build/KeepAwake.exe
          if-no-files-found: error

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/KeepAwake.exe
            build/KeepAwake.exe.sha256
          generate_release_notes: true
